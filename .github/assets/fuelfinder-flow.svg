nslate(644px,210px)}}@keyframes guide1{0%,49.58%{stroke-dashoffset:1;opacity:.35}57.08%{stroke-dashoffset:0;opacity:1}95.83%{stroke-dashoffset:0;opacity:1}99.17%,100%{stroke-dashoffset:0;opacity:.35}}@keyframes val1{0%,57.67%{opacity:0}59.17%,95.83%{opacity:1}99.17%,100%{opacity:0}}@keyframes ph1{0%,56.67%{opacity:1}57.67%,95.83%{opacity:0}99.17%,100%{opacity:1}}@keyframes flash1{0%,56.67%{stroke-opacity:0}57.92%{stroke-opacity:1}65.00%,100%{stroke-opacity:0}}@keyframes band2{0%,66.67%{opacity:0}70.00%,95.00%{opacity:1}98.33%,100%{opacity:0}}@keyframes scan2{0%,69.17%{opacity:0;transform:translateY(128px)}69.58%{opacity:1;transform:translateY(128px)}80.42%{opacity:1;transform:translateY(345px)}81.25%,100%{opacity:0;transform:translateY(345px)}}@keyframes ring2{0%,80.83%{opacity:0;transform:scale(.85)}83.33%{opacity:1;transform:scale(1)}95.83%{opacity:1;transform:scale(1)}99.17%,100%{opacity:0;transform:scale(1)}}@keyframes dot2{0%,82.92%{opacity:0;transform:translate(494.0px,326px)}83.33%{opacity:1;transform:translate(494.0px,326px)}86.25%{opacity:1;transform:translate(586px,326px)}88.33%{opacity:1;transform:translate(614px,294px)}90.42%{opacity:1;transform:translate(644px,294px)}91.67%,100%{opacity:0;transform:translate(644px,294px)}}@keyframes guide2{0%,82.92%{stroke-dashoffset:1;opacity:.35}90.42%{stroke-dashoffset:0;opacity:1}95.83%{stroke-dashoffset:0;opacity:1}99.17%,100%{stroke-dashoffset:0;opacity:.35}}@keyframes val2{0%,91.00%{opacity:0}92.50%,95.83%{opacity:1}99.17%,100%{opacity:0}}@keyframes ph2{0%,90.00%{opacity:1}91.00%,95.83%{opacity:0}99.17%,100%{opacity:1}}@keyframes flash2{0%,90.00%{stroke-opacity:0}91.25%{stroke-opacity:1}98.33%,100%{stroke-opacity:0}}
.band0{animation:band0 12s linear infinite}.scan0{animation:scan0 12s linear infinite}.ring0{animation:ring0 12s linear infinite}.dot0{animation:dot0 12s linear infinite}.guide0{animation:guide0 12s linear infinite}.val0{animation:val0 12s linear infinite}.ph0{animation:ph0 12s linear infinite}.flash0{animation:flash0 12s linear infinite}.band1{animation:band1 12s linear infinite}.scan1{animation:scan1 12s linear infinite}.ring1{animation:ring1 12s linear infinite}.dot1{animation:dot1 12s linear infinite}.guide1{animation:guide1 12s linear infinite}.val1{animation:val1 12s linear infinite}.ph1{animation:ph1 12s linear infinite}.flash1{animation:flash1 12s linear infinite}.band2{animation:band2 12s linear infinite}.scan2{animation:scan2 12s linear infinite}.ring2{animation:ring2 12s linear infinite}.dot2{animation:dot2 12s linear infinite}.guide2{animation:guide2 12s linear infinite}.val2{animation:val2 12s linear infinite}.ph2{animation:ph2 12s linear infinite}.flash2{animation:flash2 12s linear infinite}
}
</style>
