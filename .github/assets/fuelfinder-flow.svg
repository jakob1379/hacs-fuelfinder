<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
<title id="t">Fuelfinder data flow</title>
<desc id="d">The fuelfinder.dk price list has one row per fuel company and one column per fuel type. For each fuel type the integration takes the lowest listed price and publishes it as a Home Assistant sensor.</desc>
<style>
:root{--bg:#E8EEF2;--panel:#FFFFFF;--ink:#12303F;--muted:#587080;--line:#D5DFE5;--accent:#C98A00;--accent-soft:rgba(201,138,0,.16);--band:rgba(18,48,63,.06);--price:#12303F}
@media (prefers-color-scheme:dark){:root{--bg:#0E1E28;--panel:#152A36;--ink:#E3ECF1;--muted:#8DA4B2;--line:#23404F;--accent:#FFC23D;--accent-soft:rgba(255,194,61,.15);--band:rgba(255,255,255,.05);--price:#FFC23D}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums}
.muted{fill:var(--muted)}
.panel{fill:var(--panel);stroke:var(--line)}
.hair{stroke:var(--line);stroke-width:1}
.band{fill:var(--band);opacity:0}
.scan{fill:var(--accent);opacity:0}
.ring{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center}
.dot{opacity:0}
.dot circle:first-child{fill:var(--accent-soft)}
.dot circle:last-child{fill:var(--accent)}
.guide{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:1 0}
.card{fill:var(--bg);stroke:var(--accent);stroke-width:2;stroke-opacity:0}
.icon{fill:var(--accent-soft)}
.glyph{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.val{fill:var(--price);font-size:24px;font-weight:700}
.ph{opacity:0}
@media (prefers-reduced-motion:no-preference){
.guide{stroke-dasharray:1 1}
